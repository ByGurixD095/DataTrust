spring.application.name=datatrust

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=datatrust
app.security.jwt.expiration=PT15M

spring.servlet.multipart.max-file-size=${DATATRUST_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DATATRUST_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.file-size-threshold=1MB